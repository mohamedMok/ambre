<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ambre is an open-source design system. A warm theme, semantic tokens, and one library of Svelte web components."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('amb-theme');
          var theme =
            stored ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          var brand = localStorage.getItem('amb-brand');
          if (brand && brand !== 'ambre') document.documentElement.dataset.brand = brand;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
