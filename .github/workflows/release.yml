name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Until the NPM_TOKEN secret exists, releasing is switched off and the workflow stays green.
      - name: Releasing is off
        if: env.NPM_TOKEN == ''
        run: echo "::notice::Add the NPM_TOKEN repository secret to publish @ambre-ds packages."

      # With pending changesets: opens or updates the "Version packages" pull request.
      # With none: publishes every package whose version is not on npm yet, with provenance.
      - name: Version or publish
        if: env.NPM_TOKEN != ''
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
