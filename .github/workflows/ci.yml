name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: pnpm --filter @ambre-ds/ui build
      - run: pnpm --filter @ambre-ds/storybook build
      - run: mkdir -p apps/docs/static && rm -rf apps/docs/static/storybook && cp -R apps/storybook/storybook-static apps/docs/static/storybook
      - run: pnpm --filter @ambre-ds/docs build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: docs
          path: apps/docs/build
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: apps/docs/build
      - run: npx --yes surge ./apps/docs/build mohamedmok-ambre.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
