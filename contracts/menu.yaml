id: menu
tag: amb-menu
status: stable
summary: A button that opens a menu of actions. The default slot names the button, and the panel slot holds the actions.
anatomy:
  - id: control
    element: button
    part: control
    slot: default
  - id: panel
    element: div
    part: panel
    slot: panel
props:
  - name: open
    type: boolean
    default: false
    attribute: open
    reflect: true
    description: Whether the action list is shown.
  - name: disabled
    type: boolean
    default: false
    attribute: disabled
    reflect: true
    description: Removes the button from the tab order and blocks opening.
slots:
  - name: default
    description: Visible name of the button that opens the list.
  - name: panel
    description: Native buttons, one action each. Each receives the menuitem role.
events:
  - name: toggle
    detail: "{ open: boolean }"
    description: Fired after the list opens or closes.
  - name: select
    detail: "{ item: HTMLButtonElement; value: string }"
    description: Fired when a person picks an item. value is the button's value, or its text. The item's own click fires too.
a11y:
  role: menu
  name: The button is named by its slotted text. Each action is named by its own text.
  keyboard:
    - Enter and Space toggle the list from the button, and activate an action.
    - ArrowDown opens the list and moves through the actions.
    - ArrowUp, Home, and End move through the actions.
    - Escape closes the list and returns focus to the button.
    - Tab closes the list and moves focus onward.
  notes:
    - The trigger is a native button with aria-haspopup set to menu.
    - Each action is a native button with the menuitem role.
    - A click outside the list closes it.
tokens:
  - color.fg.default
  - color.fg.disabled
  - color.bg.surface
  - color.bg.subtle
  - color.bg.disabled
  - color.border.default
  - color.focus.ring
