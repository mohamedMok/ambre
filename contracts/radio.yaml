id: radio
tag: amb-radio
status: stable
summary: Selects one choice in a named group. The label is the slotted text, and the checked radio joins the nearest form.
anatomy:
  - id: field
    element: label
    part: field
  - id: control
    element: input
    part: control
  - id: label
    slot: default
  - id: message
    element: p
    part: message
props:
  - name: name
    type: string
    default: ""
    attribute: name
    reflect: true
    description: Group name. Radios that share a name in one form submit a single value.
  - name: value
    type: string
    default: ""
    attribute: value
    reflect: true
    description: Value submitted while this radio is checked.
  - name: checked
    type: boolean
    default: false
    attribute: checked
    reflect: true
    description: Whether this choice is selected.
  - name: disabled
    type: boolean
    default: false
    attribute: disabled
    reflect: true
    description: Removes the control from the tab order and blocks selection.
  - name: required
    type: boolean
    default: false
    attribute: required
    reflect: true
    description: The form cannot submit until one radio in the group is checked.
slots:
  - name: default
    description: Accessible name. Keep this text visible.
events:
  - name: change
    detail: "{ value: string }"
    description: Fired on the radio that becomes checked, by a click or by the arrow keys. The group has one listener if it sits on the fieldset.
a11y:
  role: radio
  name: Slotted text. Group the radios in a fieldset with a legend.
  keyboard:
    - Arrow keys move the selection within the named group.
    - Tab enters and leaves the group.
  notes:
    - The inner input is native, so the role is not re-authored with ARIA.
    - Only the selected radio, or the first if none is selected, is in the tab order.
    - Disabled radios are skipped by the arrow keys.
tokens:
  - color.fg.default
  - color.fg.disabled
  - color.accent.bg
  - color.status.danger.fg
  - color.focus.ring
  - focus.ring.width
  - focus.ring.offset
  - font.family.sans
  - font.size.200
  - font.size.300
  - font.weight.regular
  - font.lineHeight.body
  - space.100
  - space.300
  - size.control.md
  - size.icon.lg
  - color.fg.on-accent
  - color.bg.surface
  - color.bg.disabled
  - color.border.default
  - color.border.strong
  - color.border.disabled
  - color.accent.bg-hover
  - color.accent.bg-active
  - color.highlight
  - color.focus.halo
  - focus.halo.width
  - elevation.inset
  - elevation.1
  - radius.full
  - border.width.default
  - duration.fast
  - duration.moderate
  - easing.standard
  - easing.enter
  - easing.spring
