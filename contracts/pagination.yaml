id: pagination
tag: amb-pagination
status: stable
summary: Moves between pages of a list. The slotted links are the pages, and the current one is marked.
anatomy:
  - id: list
    element: ol
    part: list
props:
  - name: label
    type: string
    default: Pagination
    attribute: label
    reflect: true
    description: Accessible name of the navigation.
slots:
  - name: default
    description: List items. Each contains a link or a button. Mark the current page with aria-current.
events: []
a11y:
  role: navigation
  name: The label prop.
  keyboard:
    - Tab moves between the page controls.
  notes:
    - The product sets aria-current page on the current item.
tokens:
  - color.fg.default
  - font.family.sans
  - font.size.300
  - font.lineHeight.body
  - space.200
  - size.control.md
  - border.width.default
  - color.border.default
  - radius.action
  - color.bg.surface
  - color.bg.subtle
  - color.bg.muted
  - color.highlight
  - elevation.1
  - font.weight.semibold
  - duration.fast
  - duration.moderate
  - easing.standard
  - easing.spring
