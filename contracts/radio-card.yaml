id: radio-card
tag: amb-radio-card
status: draft
summary: One choice in a named group, with room to explain. The whole card selects it, and the checked card joins the nearest form.
anatomy:
  - id: field
    element: label
    part: field
  - id: icon
    slot: icon
    part: icon
  - id: label
    slot: default
    part: label
  - id: description
    slot: description
    part: description
  - id: control
    element: input
    part: control
  - id: message
    element: p
    part: message
props:
  - name: name
    type: string
    default: ""
    attribute: name
    reflect: true
    description: Group name. Cards that share a name in one form submit a single value.
  - name: value
    type: string
    default: ""
    attribute: value
    reflect: true
    description: Value submitted while this card is checked.
  - name: checked
    type: boolean
    default: false
    attribute: checked
    reflect: true
    description: Whether this choice is selected.
  - name: disabled
    type: boolean
    default: false
    attribute: disabled
    reflect: true
    description: Removes the card from the group's keyboard order and blocks selection.
  - name: required
    type: boolean
    default: false
    attribute: required
    reflect: true
    description: The form cannot submit until one card in the group is checked.
slots:
  - name: default
    description: Accessible name, in a few words.
  - name: description
    description: The facts people compare, such as the price or the delay. It is read as the description.
  - name: icon
    description: An amb-icon, decorative.
events:
  - name: change
    detail: "{ value: string }"
    description: Fired on the card that becomes checked, by a click or by the arrow keys. The group has one listener if it sits on the fieldset.
a11y:
  role: radio
  name: The slotted label. The description slot is the accessible description.
  keyboard:
    - Arrow keys move the selection within the named group.
    - Tab enters and leaves the group.
  notes:
    - The inner input is native, so the role and states are not re-authored with ARIA.
    - Only the selected card, or the first if none is selected, is in the tab order.
    - Group the cards in a fieldset with a legend that asks the question.
tokens:
  - color.bg.surface
  - color.bg.subtle
  - color.bg.disabled
  - color.fg.default
  - color.fg.muted
  - color.fg.disabled
  - color.fg.on-accent
  - color.accent.bg
  - color.accent.bg-active
  - color.accent.fg
  - color.border.default
  - color.border.strong
  - color.border.disabled
  - color.status.danger.fg
  - color.highlight
  - color.focus.ring
  - color.focus.halo
  - focus.ring.width
  - focus.ring.offset
  - focus.halo.width
  - elevation.1
  - elevation.2
  - elevation.inset
  - radius.md
  - radius.lg
  - radius.full
  - border.width.default
  - size.control.sm
  - size.icon.md
  - space.100
  - space.200
  - space.300
  - space.400
  - font.family.sans
  - font.size.200
  - font.size.300
  - font.weight.semibold
  - font.lineHeight.body
  - font.lineHeight.tight
  - duration.fast
  - duration.moderate
  - easing.standard
  - easing.spring
